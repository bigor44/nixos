# Statix linter configuration for bigor.* NixOS modules
# Purpose: Document codebase conventions and disable overly strict rules

nix_version = '2.4'
ignore = ['.direnv', 'result', '.git']

# ============================================================================
# Disabled Lints
# ============================================================================

disabled = [
  # W07 - eta_reduction: Can reduce readability in some contexts
  # Example: x: foo x → foo (sometimes the expanded form is clearer)
  # We prefer explicit forms when they improve code understanding
  "eta_reduction",
]

# ============================================================================
# Codebase Conventions (enforced via code review and this documentation)
# ============================================================================
#
# 1. NO 'with lib;' - Use explicit imports instead:
#    ✓ inherit (lib) mkOption mkIf mkEnableOption types;
#    ✗ with lib;
#
#    Rationale: Explicit imports improve code clarity, prevent namespace
#    pollution, and make it obvious which lib functions are used.
#
# 2. All feature modules MUST use mkEnableOption:
#    ✓ enable = mkEnableOption "Feature description";
#    ✗ enable = mkOption { type = types.bool; default = false; ... };
#
#    Rationale: mkEnableOption provides consistent enable option pattern
#    across all bigor.features.<category>.* modules with automatic description.
#
# 3. Policy modules use readOnly options for computed values:
#    ✓ computed.value = mkOption { type = types.str; readOnly = true; };
#
#    Rationale: Policy layer computes strategic decisions (DNS mode, kernel)
#    and provides read-only values to consuming modules.
#
# 4. Prefer explicit imports over wildcard patterns:
#    ✓ inherit (lib) mkOption mkIf;
#    ✗ inherit (lib) *;
#
#    Rationale: Makes dependencies explicit and prevents accidental usage
#    of unintended functions.
#
# 5. Module pattern structure:
#    ```nix
#    { config, lib, pkgs, ... }:
#    let
#      inherit (lib) mkEnableOption mkIf;
#      cfg = config.bigor.<category>.<module>;
#    in
#    {
#      options.bigor.<category>.<module> = { ... };
#      config = mkIf cfg.enable { ... };
#    }
#    ```
#
# ============================================================================
# Exception Patterns
# ============================================================================
#
# The following files are excluded from linting:
# - hardware-configuration.nix (auto-generated by nixos-generate-config)
# - .direnv/ (development environment cache)
# - result (nix build output symlink)
# - .git/ (git metadata)
#
# ============================================================================
