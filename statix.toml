# Statix linter configuration
# Purpose: Lint settings and the Nix conventions statix cannot enforce

# Nix shipped by the system (nix.package); version-gated lints assume at least this
nix_version = '2.34'
ignore = ['.direnv', 'result', '.git']

disabled = [
  # eta_reduction (W07): `x: foo x` is sometimes clearer than `foo`
  "eta_reduction",
]

# Conventions (enforced by review, see CLAUDE.md):
#
# 1. No option layer: modules/nixos/<topic>.nix are plain modules grouped by
#    topic, imported directly by hosts/grospc/configuration.nix. No `enable`
#    options, no `mkIf cfg.enable` wrappers.
#
# 2. No `with lib;`: use `inherit (lib) ...;` or `lib.foo`, so it is obvious
#    where each function comes from (`with pkgs;` in package lists is fine).
#
# 3. Every .nix file starts with `# Platform:` (or `# Host:` / `# Home:` /
#    `# Flake:`) and `# Purpose:` header lines.
