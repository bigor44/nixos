# Treefmt configuration; formatters are bundled by the flake formatter (nix/devshell.nix)

[global]
on-error = "continue"

[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]

[formatter.shell]
command = "shfmt"
includes = ["*.sh"]
options = ["-i", "2", "-s", "-w"]

[formatter.prettier]
command = "prettier"
options = ["--write"]
includes = ["*.md", "*.json", "*.yaml", "*.yml", "*.html", "*.css", "*.scss"]

[formatter.toml]
command = "taplo"
options = ["fmt"]
includes = ["*.toml"]

[formatter.lua]
command = "stylua"
includes = ["*.lua"]
