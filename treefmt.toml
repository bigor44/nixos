# treefmt.toml
[global]
project_root_file = "flake.nix"

excludes = [
  ".git/**",
  "*.png",
  "*.jpg",
  "*.jpeg",
  "*.agekey",
  "result",
  "result-*",
  "secrets/secrets.yaml",
  "lazy-lock.json",
  "LICENSE",
  "*.lock",  # ✅ Ajout : flake.lock ne doit pas être formaté
  ".direnv/**",  # ✅ Ajout si vous utilisez direnv
]

# --- NIX (via nixfmt) ---
[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]
# ✅ Priorité pour éviter les conflits
priority = 1

# --- LUA (via stylua) ---
[formatter.lua]
command = "stylua"
options = ["--config-path", "stylua.toml"]  # ✅ Explicit config
includes = ["*.lua"]

# --- SHELL (via shfmt) ---
[formatter.shfmt]
command = "shfmt"
options = ["-i", "2", "-s", "-w"] # Indentation 2 espaces, simplify, write
includes = ["*.sh", "*.bash"]

# --- YAML (via yamlfmt) ---
[formatter.yaml]
command = "yamlfmt"
includes = ["*.yaml", "*.yml"]
excludes = ["secrets/**"]  # ✅ Double sécurité

# --- PRETTIER (JSON, Markdown, etc.) ---
[formatter.prettier]
command = "prettier"
options = ["--write", "--prose-wrap", "always"]  # ✅ Markdown wrapping
includes = [
  "*.md",
  "*.json",
  "*.html",
  "*.css",
  "*.js",
  "*.ts",
]
